# ============================================================
# pyproject.toml - Konfigurasi ruff, mypy, pytest
# ============================================================

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["validator_dokumen", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF001", "B023", "N818", "N806", "SIM102", "SIM116", "E741", "B904"]  # panjang baris & unicode simbol ditangani format

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert boleh di test
"tools/*" = ["T201"]  # print boleh di tools

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
files = ["validator_dokumen/core", "validator_dokumen/services"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["fitz.*", "cv2.*", "pytesseract.*", "rapidfuzz.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=validator_dokumen/core --cov=validator_dokumen/services --cov-report=term-missing --cov-fail-under=85 --timeout=60"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["validator_dokumen/core", "validator_dokumen/services"]
